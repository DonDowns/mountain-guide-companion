name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    steps:
      - name: Check out Companion
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Confirm Node setup and clean checkout
        shell: bash
        run: |
          node --version
          npm --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test -z "$(git status --porcelain)"

      - name: Install pinned browser-test dependencies
        run: npm ci

      - name: Set up Python for deterministic print tooling
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned print dependencies and Poppler
        shell: bash
        run: |
          apt-get update
          apt-get install --yes poppler-utils
          python -m pip install --requirement requirements-print.txt

      - name: Check out pinned Mountain Guide source
        uses: actions/checkout@v7
        with:
          repository: DonDowns/mountain-guide
          ref: v15.3.10
          fetch-depth: 0
          persist-credentials: false
          path: .upstream/mountain-guide

      - name: Parse JSON, check JavaScript syntax, and enforce phase scope
        run: npm run check:repository

      - name: Validate repository automation policy
        run: npm run check:policy -- --repository-only

      - name: Test automation policy fail-closed behavior
        run: npm run test:automation

      - name: Test live-site verifier fail-closed behavior
        run: npm run test:live-verifier

      - name: Run aggregate data contracts
        env:
          MOUNTAIN_GUIDE_REPO: ${{ github.workspace }}/.upstream/mountain-guide
        run: npm run check:data

      - name: Run manifest contract
        run: npm run check:manifest

      - name: Run source provenance contract
        env:
          MOUNTAIN_GUIDE_REPO: ${{ github.workspace }}/.upstream/mountain-guide
        run: npm run check:provenance

      - name: Run privacy contract
        run: npm run check:privacy

      - name: Run safety contract
        run: npm run check:safety

      - name: Build deterministic three-page Field Guide
        run: npm run build:field-guide

      - name: Run Field Guide manifest-parity contract
        run: npm run check:field-guide

      - name: Run PDF page, content, and render contracts
        run: npm run check:pdf

      - name: Build deterministic two-sided Pocket Card
        run: npm run build:pocket-card

      - name: Run Pocket Card manifest-parity contract
        run: npm run check:pocket-card

      - name: Run Pocket Card page, content, and render contracts
        run: npm run check:pocket-card-pdf

      - name: Build deterministic Companion PWA data and release metadata
        run: npm run build:pwa

      - name: Build explicit offline bundle and production service worker
        run: npm run build:offline

      - name: Run Companion PWA structural contract
        run: npm run check:pwa

      - name: Run mountain-earth visual-system and contrast contract
        run: npm run check:visual-system

      - name: Run Companion PWA privacy contract
        run: npm run check:pwa:privacy

      - name: Run Companion PWA safety contract
        run: npm run check:pwa:safety

      - name: Run offline bundle byte-integrity contract
        run: npm run check:offline

      - name: Run service-worker static contract checks
        run: npm run check:service-worker

      - name: Run real service-worker runtime lifecycle tests
        run: npm run test:service-worker:runtime

      - name: Build flattened GitHub Pages candidate artifact
        run: |
          npm run build:pages
          test -f .pages-site/index.html
          test -f .pages-site/service-worker.js
          test -f .pages-site/release.json
          test -f .pages-site/offline-bundle.json
          test -f .pages-site/generated/field-guide.pdf
          test -f .pages-site/generated/pocket-card.pdf

      - name: Run transaction model tests
        run: npm run test:offline:logic

      - name: Run three-artifact parity contract
        run: npm run check:artifact-parity

      - name: Run Chromium and WebKit browser, install-flow, and accessibility tests
        run: npm run test:browser

      - name: Run zero-connectivity, interrupted-update, corruption, and repair browser tests
        run: npm run test:offline

      - name: Verify all generated artifacts reproduce committed bytes
        run: git diff --exit-code -- generated js/companion-data.js release.json offline-bundle.json service-worker.js

      - name: Determine canonical manifest SHA-256
        run: sha256sum data/trip-manifest.json

      - name: Verify final tracked-file and whitespace integrity
        shell: bash
        run: |
          git diff --check
          git diff --cached --check
          test -z "$(git status --porcelain --untracked-files=no)"
